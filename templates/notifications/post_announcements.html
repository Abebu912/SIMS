{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans "Post Announcements" %}{% endblock %}
{% block content %}
<div class="container py-5">
  <h2>{% trans "Post Announcements" %}</h2>
  <p class="text-muted">This is a placeholder page. Implement announcement posting UI here.</p>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">{% trans "Title" %}</label>
      <input class="form-control" name="title" />
    </div>
    <div class="mb-3">
      <label class="form-label">{% trans "Content" %}</label>
      <textarea class="form-control" name="content" rows="6"></textarea>
    </div>
    <button class="btn btn-primary">{% trans "Post" %}</button>
  </form>
</div>
{% endblock %}
